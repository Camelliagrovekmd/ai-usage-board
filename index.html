<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 운영실">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>AI 동백숲한의원 운영실</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8eaf0;--mut:#8b93a7;--ok:#3ecf8e;--warn:#f5b041;--bad:#ef5350;--acc:#7aa2ff}
  @media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--card:#fff;--line:#e3e6ec;--tx:#1b1f29;--mut:#6b7385}}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--tx)}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
  header h1{font-size:18px;margin:0}
  header .meta{margin-left:auto;color:var(--mut);font-size:12px;text-align:right}
  button,input{font:inherit}
  .btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .05s;text-decoration:none;display:inline-block}
  .btn:active{transform:scale(.96)}
  .btn.busy{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.done{background:var(--ok);border-color:var(--ok);color:#06210f}
  .btn.same{background:var(--line);color:var(--tx)}
  .btn.fail{background:var(--bad);border-color:var(--bad);color:#fff}
  .btn.tg{background:#229ED9;border-color:#229ED9;color:#fff}
  .advice{margin:8px 16px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
  .stale{margin:0 16px 8px;padding:10px 12px;border-radius:12px;border:1px solid var(--warn);color:var(--warn);font-size:13px;display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:4px 16px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .card h2{font-size:16px;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}
  .sub{color:var(--mut);font-size:12px;margin:3px 0 8px}
  .row{margin:12px 0}
  .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:5px}
  .lab b{color:var(--tx);font-size:14px}
  .bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;color:var(--mut)}
  .kv b{color:var(--tx);text-align:right}
  .models{margin-top:10px;font-size:12px;color:var(--mut)} .models div{display:flex;justify-content:space-between}
  svg.spark{width:100%;height:40px;margin-top:6px}
  .tabs{display:flex;gap:6px;margin:6px 16px 0}
  .tab{flex:1;text-align:center;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:14px;cursor:pointer}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .it{display:flex;gap:8px;align-items:flex-start;font-size:13px}
  .it .t{flex:1;min-width:0}
  .it .t b{display:block;color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .t span{color:var(--mut);font-size:12px}
  .st{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
  .st.run{background:var(--acc);color:#fff} .st.ok{background:var(--line);color:var(--tx)} .st.err{background:var(--bad);color:#fff} .st.good{background:var(--ok);color:#06210f}
  .res{color:var(--mut);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nums{display:flex;gap:8px;margin-top:4px} .nums div{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center} .nums b{display:block;font-size:20px} .nums span{font-size:11px;color:var(--mut)}
  .wl{padding:0 16px 16px}
  .wl .card h2{margin-bottom:4px}
  .day{border-top:1px solid var(--line);padding:10px 0 4px}
  .day:first-of-type{border-top:0}
  .day .dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .day .dh b{font-size:14px}
  .day .dh span{color:var(--mut);font-size:12px}
  .day ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55}
  .day li{margin:2px 0}
  .day li em{font-style:normal;font-size:11px;font-weight:700;color:var(--acc);margin-right:4px}
  .more{width:100%;margin-top:8px}
  footer{color:var(--mut);font-size:11px;padding:0 16px 24px;line-height:1.6}
  #lock{max-width:360px;margin:18vh auto 0;padding:24px;text-align:center}
  #lock h1{font-size:20px} #lock p{color:var(--mut);font-size:13px}
  #lock input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin:12px 0;font-size:16px}
  #lock .btn{width:100%;padding:12px;background:var(--acc);border:0;color:#fff;font-weight:700}
  #lock .err{color:var(--bad);font-size:13px;min-height:18px}
  .hide{display:none}
</style>
</head>
<body>
<div id="lock">
  <h1>AI 동백숲한의원 운영실</h1>
  <p>비밀번호를 입력하세요. 이 기기에 한 번만 저장됩니다.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <button class="btn" id="go">열기</button>
  <div class="err" id="err"></div>
</div>
<div id="app" class="hide">
  <header>
    <h1>🌿 AI 동백숲한의원 운영실</h1>
    <button class="btn" id="reload">새로고침</button>
    <a class="btn tg" id="live" href="https://t.me/Camelliagrove_kmcbot?text=%EC%82%AC%EC%9A%A9%EB%9F%89" target="_blank" rel="noopener">실시간 조회</a>
    <div class="meta" id="meta"></div>
  </header>
  <div class="tabs"><div class="tab on" data-v="office">운영실</div><div class="tab" data-v="use">사용량</div><div class="tab" data-v="ctl">관제</div></div>
  <div class="stale" id="stale"></div>
  <div id="office"></div>
  <div id="use" class="hide"><div class="advice" id="advice"></div>
  <div class="grid" id="grid"></div>
  <div class="wl" id="wl"></div></div>
  <div id="ctl" class="hide"><div class="grid" id="cgrid"></div></div>
  <footer>
    새로고침: 매시간(08~22시) 올라오는 최신 데이터를 다시 불러와요.<br>실시간 조회: 텔레그램에 "사용량"이 입력된 채로 열려요. 전송하면 실시간으로 조회하고 이 화면도 1~2분 안에 갱신돼요.<br>
    초록 &lt;50% · 노랑 &lt;80% · 빨강 ≥80% · 그래프 실선 5시간, 점선 주간.
    <br><a href="#" id="logout" style="color:var(--mut)">이 기기에서 비밀번호 지우기</a>
  </footer>
</div>
<script>window.OF_AVATAR="office/avatar.png?v=1793095546593"</script>
<script>if(new URLSearchParams(location.search).get('full')==='1'){window.__ofFull=true;try{localStorage.setItem('aiusage.tab','office')}catch(e){}}</script>
<script src="office-view.js?v=1793148214644"></script>
<script>
const $ = s => document.querySelector(s);
const KEY = 'aiusage.pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(env, pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(env.salt), iterations: env.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const col = p => p == null ? 'var(--line)' : p >= 80 ? 'var(--bad)' : p >= 50 ? 'var(--warn)' : 'var(--ok)';
const fmtTok = n => n == null ? '-' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? Math.round(n/1e3)+'K' : String(n);
function left(iso){ if(!iso) return ''; let s=Math.max(0,(Date.parse(iso)-Date.now())/1000); const d=Math.floor(s/86400); s-=d*86400; const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60);
  const at=new Date(iso).toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
  return Date.parse(iso) < Date.now() ? '리셋됨 ('+at+')' : (d?d+'일 ':'')+(h?h+'시간 ':'')+m+'분 후 리셋 ('+at+')'; }
function ago(iso){ if(!iso) return ''; const m=Math.round((Date.now()-Date.parse(iso))/60000); return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'; }
function bar(label,w){ if(!w) return ''; const p=w.usedPct;
  return `<div class="row"><div class="lab"><span>${label}</span><b>${p??'-'}% 사용 · ${p==null?'-':100-p}% 남음</b></div>
  <div class="bar"><i style="width:${p??0}%;background:${col(p)}"></i></div>
  <div class="lab" style="margin-top:4px"><span>${left(w.resetsAt)}</span></div></div>`; }
function spark(h,k5,kw){ const pts=(h||[]).filter(x=>x[k5]!=null).slice(-72); if(pts.length<2) return '';
  const line=k=>pts.map((x,i)=>`${(i/(pts.length-1)*100).toFixed(1)},${(40-(x[k]??0)/100*38).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><polyline fill="none" stroke="var(--acc)" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${line(k5)}"/><polyline fill="none" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 2" vector-effect="non-scaling-stroke" points="${line(kw)}"/></svg>`; }
function card(k,s,d){ if(!s) return ''; const at=d.updatedAt?.[k]; const age=at?`<span class="pill">${ago(at)}</span>`:'';
  let body='';
  if(!s.ok) body=`<div class="sub" style="color:var(--bad)">${s.error||'조회 실패'}</div>`;
  else if(k==='aside'){ const f=s.fiveHour,w=s.weekly,m=s.extra?.byModel||{};
    body=`<div class="kv"><span>최근 5시간</span><b>${fmtTok(f.tokens)} 토큰 · ${f.turns}턴</b><span>최근 7일</span><b>${fmtTok(w.tokens)} 토큰 · ${w.turns}턴</b><span>API 환산(7일)</span><b>$${w.costUsd}</b></div>
    <div class="models">${Object.entries(m).sort((a,b)=>b[1].tokens-a[1].tokens).slice(0,5).map(([n,v])=>`<div><span>${n}</span><span>${fmtTok(v.tokens)}</span></div>`).join('')}</div>`; }
  else { body=bar('5시간 한도',s.fiveHour)+bar('주간 한도',s.weekly); const ex=s.extra||{};
    if(ex.weeklyOpus) body+=bar('주간 Opus',ex.weeklyOpus);
    if(ex.resetCoupons!=null) body+=`<div class="kv"><span>한도 초기화 쿠폰</span><b>${ex.resetCoupons}개</b></div>`;
    body+= k==='claude'?spark(d.history,'claude5h','claudeW'):spark(d.history,'gpt5h','gptW'); }
  return `<div class="card"><h2>${s.label}<span class="pill">${s.plan||''}</span>${age}</h2><div class="sub">${s.account||''}</div>${body}</div>`; }
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const stPill=s=>s==='running'?'<span class="st run">진행 중</span>':s==='errored'?'<span class="st err">오류</span>':'<span class="st ok">완료</span>';
function when(iso){ if(!iso) return '-'; return new Date(iso).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function renderCtl(c){
  if(!c){ $('#cgrid').innerHTML='<div class="card"><div class="sub">관제 데이터가 아직 없어요. 다음 정각 갱신 후 표시됩니다.</div></div>'; return; }
  if(c.error){ $('#cgrid').innerHTML='<div class="card"><div class="sub" style="color:var(--bad)">관제 데이터 오류: '+esc(c.error)+'</div></div>'; return; }
  const run=c.tasks.filter(t=>t.status==='running').length, err=c.tasks.filter(t=>t.status==='errored').length;
  const rOk=c.routines.filter(r=>r.ok===false).length;
  const summary=`<div class="card"><h2>한눈에 보기<span class="pill">최근 ${c.hours}시간</span></h2>
    <div class="nums"><div><b>${run}</b><span>진행 중</span></div><div><b>${c.tasks.length-run-err}</b><span>완료</span></div><div><b style="color:${err?'var(--bad)':'inherit'}">${err}</b><span>오류</span></div><div><b style="color:${rOk?'var(--bad)':'inherit'}">${rOk}</b><span>루틴 실패</span></div></div>
    <div class="list" style="margin-top:12px">${(c.channels||[]).map(ch=>`<div class="it"><div class="t"><b>텔레그램 @${esc(ch.name)}</b><span>프로젝트: ${esc(ch.project)}</span></div><span class="st ${ch.status==='connected'?'good':'err'}">${ch.status==='connected'?'연결됨':esc(ch.status)}</span></div>`).join('')}</div></div>`;
  const tasks=`<div class="card"><h2>작업 현황</h2><div class="list">${c.tasks.map(t=>`<div class="it"><div class="t"><b>${esc(t.title)}</b><span>${esc(t.project)} · ${esc(t.source)} · ${when(t.updatedAt)}</span></div>${stPill(t.status)}</div>`).join('')||'<div class="sub">최근 작업 없음</div>'}</div></div>`;
  const routines=`<div class="card"><h2>루틴</h2><div class="list">${c.routines.map(r=>`<div class="it"><div class="t"><b>${esc(r.name)}</b><span>마지막 ${when(r.lastRunAt)} · 다음 ${when(r.nextRunAt)} · 24시간 ${r.runs24h}회</span><div class="res">${esc(r.lastResult)}</div></div><span class="st ${r.ok===false?'err':r.ok?'good':'ok'}">${r.ok===false?'실패':r.ok?'정상':'기록 없음'}</span></div>`).join('')||'<div class="sub">활성 루틴 없음</div>'}</div></div>`;
  const proj=`<div class="card"><h2>프로젝트별</h2><div class="list">${Object.entries(c.byProject).sort((a,b)=>(/프로젝트 (밖|없음)/.test(a[0])?1:0)-(/프로젝트 (밖|없음)/.test(b[0])?1:0)||a[0].localeCompare(b[0],'ko')).map(([p,b])=>`<div class="it"><div class="t"><b>${esc(p)}</b><span>진행 중 ${b.running} · 완료 ${b.done}${b.error?' · 오류 '+b.error:''}</span></div></div>`).join('')}</div></div>`;
  $('#cgrid').innerHTML=summary+tasks+routines+proj;
}
let wlAll=false;
function renderWl(list){
  const el=$('#wl'); if(!el) return;
  if(!list||!list.length){ el.innerHTML='<div class="card"><h2>AI 작업일지</h2><div class="sub">아직 기록이 없어요. 매일 밤 18:30에 그날 작업이 요약돼 올라와요.</div></div>'; return; }
  const fmtD=s=>{ const d=new Date(s+'T00:00:00+09:00'); return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short',timeZone:'Asia/Seoul'}); };
  const shown=wlAll?list:list.slice(0,7);
  el.innerHTML=`<div class="card"><h2>AI 작업일지<span class="pill">${list.length}일 기록</span></h2><div class="sub">매일 주요 작업을 짧게 요약해 쌓아요 (18:30 자동 기록)</div>${shown.map(e=>`<div class="day"><div class="dh"><b>${esc(fmtD(e.date))}</b><span>${esc(e.headline||'')}</span></div><ul>${(e.items||[]).map(i=>`<li><em>${esc(i.project)}</em>${esc(i.text)}</li>`).join('')}</ul></div>`).join('')}${list.length>7?`<button class="btn more" id="wlmore">${wlAll?'최근 7일만 보기':'이전 기록 더 보기 ('+(list.length-7)+'일)'}</button>`:''}</div>`;
  const m=$('#wlmore'); if(m) m.onclick=()=>{ wlAll=!wlAll; renderWl(list); };
}
function render(d){
  try{ renderOffice($('#office'), d.office, { detail:false, usage:d.services, bg:'office/office_bg.webp?v=1793101729470' }); }catch(e){ $('#office').textContent='운영실 화면 오류: '+e; }
  renderCtl(d.control);
  renderWl(d.worklog);
  $('#advice').textContent=d.advice||'';
  $('#grid').innerHTML=['claude','gpt','aside'].map(k=>card(k,d.services?.[k],d)).join('');
  $('#meta').innerHTML=`${ago(d.generatedAt)} 갱신<br>${new Date(d.generatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`;
  const old=(Date.now()-Date.parse(d.generatedAt))/60000;
  $('#stale').style.display=old>150?'block':'none';
  $('#stale').textContent=old>150?`데이터가 ${ago(d.generatedAt)} 기준입니다. PC가 꺼져 있거나 절전 중이면 갱신이 멈춰요.`:'';
}
async function load(pw){
  const env=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json();
  const d=await decrypt(env,pw); render(d); window.__lastAt=d.generatedAt; return d;
}
async function unlock(pw,save){
  try{ await load(pw); if(save) localStorage.setItem(KEY,pw); $('#lock').classList.add('hide'); $('#app').classList.remove('hide'); }
  catch(e){ $('#err').textContent = (e && e.name==='OperationError') ? '비밀번호가 맞지 않아요.' : '불러오기 실패: '+e; localStorage.removeItem(KEY); }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); ['office','use','ctl'].forEach(v=>$('#'+v).classList.toggle('hide',t.dataset.v!==v)); localStorage.setItem('aiusage.tab',t.dataset.v); });
{ const sv=localStorage.getItem('aiusage.tab'); if(sv&&document.querySelector('.tab[data-v='+sv+']')) document.querySelector('.tab[data-v='+sv+']').click(); }
$('#go').onclick=()=>unlock($('#pw').value.trim(),true);
$('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#go').click(); });
$('#reload').onclick=async()=>{
  const b=$('#reload'); if(b.classList.contains('busy')) return;
  const before=window.__lastAt;
  b.className='btn busy'; b.textContent='확인 중...';
  try{
    const d=await load(localStorage.getItem(KEY));
    const changed=d.generatedAt!==before;
    b.className='btn '+(changed?'done':'same');
    b.textContent=changed?'새 데이터 반영됨':'최신 상태';
  }catch(e){ b.className='btn fail'; b.textContent='불러오기 실패'; }
  setTimeout(()=>{ b.className='btn'; b.textContent='새로고침'; },2500);
};
$('#live').onclick=()=>{ const s=Date.now(); const p=localStorage.getItem(KEY); let n=0;
  const t=setInterval(async()=>{ n++; try{ const d=await load(p); if(Date.parse(d.generatedAt)>s){ clearInterval(t); const b=$('#reload'); b.className='btn done'; b.textContent='실시간 값 반영됨'; setTimeout(()=>{b.className='btn';b.textContent='새로고침';},4000);} }catch{} if(n>=20) clearInterval(t); },15000); };
$('#logout').onclick=e=>{ e.preventDefault(); localStorage.removeItem(KEY); location.reload(); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && localStorage.getItem(KEY)) load(localStorage.getItem(KEY)).catch(()=>{}); });
const saved=localStorage.getItem(KEY); if(saved) unlock(saved,false);
